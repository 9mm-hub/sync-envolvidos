name: Sync Envolvidos

on:
  schedule:
    # a cada 10 minutos, de segunda a sexta, das 8h às 20h (horário de Brasília = UTC-3)
    - cron: "*/10 11-23 * * 1-5"
  workflow_dispatch: {}   # botão "Run workflow" para rodar na hora

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node sync.js
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
