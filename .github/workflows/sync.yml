name: Sync Envolvidos

on:
  schedule:
    # segunda a sexta, às 18h de Brasília (21h UTC)
    - cron: "0 21 * * 1-5"
  workflow_dispatch: {}   # botão "Run workflow" para rodar na hora

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node sync.js
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
